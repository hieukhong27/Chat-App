<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp — Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow" style="width: 400px;">
  <div class="card-body p-4">
    <h4 class="text-center mb-4">💬 ChatApp</h4>

    <!-- Tab chọn đăng nhập / đăng ký -->
    <ul class="nav nav-tabs mb-4" id="authTabs">
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100 active" id="loginTab" onclick="showTab('login')">Đăng nhập</button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" id="registerTab" onclick="showTab('register')">Đăng ký</button>
      </li>
    </ul>

    <!-- Form đăng nhập -->
    <div id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="email@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••">
      </div>
      <button class="btn btn-primary w-100" onclick="login()">Đăng nhập</button>
    </div>

    <!-- Form đăng ký -->
    <div id="registerForm" style="display:none;">
      <div class="mb-3">
        <label class="form-label">Tên người dùng</label>
        <input type="text" id="regUsername" class="form-control" placeholder="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="email@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Ít nhất 6 ký tự">
      </div>
      <button class="btn btn-success w-100" onclick="register()">Tạo tài khoản</button>
    </div>

    <div id="alertBox" class="alert mt-3" style="display:none;"></div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
