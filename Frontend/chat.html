<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="chat-layout">

  <!-- ── SIDEBAR ── -->
  <div class="sidebar">
    <div class="sidebar-header p-3">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <div class="avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" id="myAvatar">?</div>
          <span class="fw-bold" id="myUsername">...</span>
        </div>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()">Đăng xuất</button>
      </div>

      <!-- Tìm kiếm -->
      <div class="mt-2">
        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="🔍 Tìm người dùng..." oninput="searchUsers(this.value)">
        <div id="searchResults" class="search-dropdown"></div>
      </div>
    </div>

    <!-- Tạo nhóm -->
    <div class="px-3 pb-2">
      <button class="btn btn-sm btn-outline-secondary w-100" data-bs-toggle="modal" data-bs-target="#createGroupModal">
        + Tạo nhóm chat
      </button>
    </div>

    <!-- Danh sách cuộc trò chuyện -->
    <div class="conversation-list" id="conversationList">
      <div class="text-center text-muted p-3 small">Đang tải...</div>
    </div>
  </div>

  <!-- ── KHU VỰC CHAT ── -->
  <div class="chat-area">

    <!-- Khi chưa chọn conversation -->
    <div class="no-chat-selected" id="noChatSelected">
      <div class="text-center text-muted">
        <div style="font-size: 3rem;">💬</div>
        <p>Chọn một cuộc trò chuyện để bắt đầu</p>
      </div>
    </div>

    <!-- Khu vực chat đang hoạt động -->
    <div id="activeChatArea" style="display:none; height:100%; display:flex; flex-direction:column;">

      <!-- Header chat -->
      <div class="chat-header p-3 border-bottom d-flex align-items-center justify-content-between">
        <div>
          <span class="fw-bold" id="chatPartnerName">-</span>
          <div class="small text-muted" id="chatStatus">offline</div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="startCall('audio')" title="Gọi thoại">📞</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="startCall('video')" title="Video call">📹</button>
        </div>
      </div>

      <!-- Tin nhắn -->
      <div class="messages-container p-3" id="messagesContainer">
        <!-- Tin nhắn sẽ được render ở đây -->
      </div>

      <!-- Đang gõ... -->
      <div class="px-3 text-muted small" id="typingIndicator" style="min-height:20px;"></div>

      <!-- Input gửi tin -->
      <div class="message-input-area p-3 border-top">
        <div class="d-flex gap-2 align-items-end">
          <!-- Emoji picker đơn giản -->
          <div class="dropdown">
            <button class="btn btn-light" type="button" data-bs-toggle="dropdown">😊</button>
            <div class="dropdown-menu p-2 emoji-picker">
              <div class="emoji-grid" id="emojiGrid"></div>
            </div>
          </div>
          <textarea id="messageInput" class="form-control" rows="1" placeholder="Nhập tin nhắn..." style="resize:none; overflow:hidden;"></textarea>
          <button class="btn btn-primary" onclick="sendMessage()">Gửi</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── MODAL TẠO NHÓM ── -->
<div class="modal fade" id="createGroupModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Tạo nhóm chat</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Tên nhóm</label>
          <input type="text" id="groupName" class="form-control" placeholder="VD: Nhóm học tập CNTT">
        </div>
        <div class="mb-3">
          <label class="form-label">Thêm bạn bè (chọn ít nhất 2 người)</label>
          <div id="friendCheckboxList" class="border rounded p-2" style="max-height:200px; overflow-y:auto;">
            <div class="text-muted small">Đang tải danh sách bạn bè...</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-primary" onclick="createGroup()">Tạo nhóm</button>
      </div>
    </div>
  </div>
</div>

<!-- ── MODAL CUỘC GỌI ── -->
<div class="modal fade" id="callModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="callModalTitle">Cuộc gọi</h5>
      </div>
      <div class="modal-body text-center">
        <div id="callStatus" class="text-muted mb-3">Đang kết nối...</div>
        <div class="video-container d-flex gap-2 justify-content-center" id="videoContainer" style="display:none!important;">
          <div class="position-relative">
            <video id="remoteVideo" autoplay playsinline class="rounded" style="width:400px; background:#000;"></video>
            <video id="localVideo" autoplay muted playsinline class="rounded position-absolute" style="width:120px; bottom:8px; right:8px; background:#333;"></video>
          </div>
        </div>
        <div id="audioCallUI" class="py-4">
          <div style="font-size:4rem;">📞</div>
          <div class="mt-2 fw-bold" id="callerName">-</div>
        </div>
        <div class="mt-3 d-flex gap-3 justify-content-center" id="callButtons">
          <button class="btn btn-success rounded-pill px-4" id="answerBtn" style="display:none;" onclick="answerCall()">Nghe máy</button>
          <button class="btn btn-danger rounded-pill px-4" onclick="endCall()">Kết thúc</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="js/socket.js"></script>
<script src="js/webrtc.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
